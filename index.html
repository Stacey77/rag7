<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ARIA – An all-knowing floating companion. Ask anything." />
  <meta name="theme-color" content="#0e0e16" />
  <title>ARIA</title>
  <link rel="manifest" href="/rag7/manifest.json" />
  <link rel="stylesheet" href="/rag7/companion.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0e0e16;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e2e8;
      overflow: hidden;
    }

    .aria-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(108,158,255,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 80% 80%, rgba(76,216,122,0.04) 0%, transparent 60%),
        #0e0e16;
      pointer-events: none;
    }

    [data-theme="light"] body {
      background: #f4f4f8;
      color: #18182a;
    }

    [data-theme="light"] .aria-bg {
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(108,158,255,0.06) 0%, transparent 70%),
        #f4f4f8;
    }

    .aria-center {
      position: relative;
      text-align: center;
      z-index: 1;
      user-select: none;
    }

    .aria-center__wordmark {
      font-size: clamp(2.4rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #6c9eff 0%, #4cd87a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .aria-center__sub {
      margin-top: 0.6rem;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(226,226,232,0.35);
    }

    [data-theme="light"] .aria-center__sub {
      color: rgba(24,24,42,0.35);
    }

    .aria-hint {
      position: fixed;
      bottom: 94px;
      right: 24px;
      font-size: 0.72rem;
      color: rgba(108,158,255,0.5);
      letter-spacing: 0.06em;
      pointer-events: none;
      animation: hint-fade 3s ease-in-out 2s forwards;
      opacity: 0;
    }

    @keyframes hint-fade {
      0%   { opacity: 0; transform: translateY(4px); }
      20%  { opacity: 1; transform: translateY(0); }
      80%  { opacity: 1; }
      100% { opacity: 0; }
    }

    .top-btn {
      position: fixed;
      top: 20px;
      background: rgba(108,158,255,0.08);
      border: 1px solid rgba(108,158,255,0.15);
      border-radius: 10px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(226,226,232,0.5);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
      z-index: 100;
    }
    .top-btn:hover { background: rgba(108,158,255,0.14); color: #6c9eff; }
    .top-btn--left  { left: 20px; }
    .top-btn--right { right: 20px; border: none; background: transparent; }
  </style>
</head>
<body>

  <div class="aria-bg"></div>

  <a href="/rag7/dashboard.html" class="top-btn top-btn--left" aria-label="Open service dashboard" title="Dashboard">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
    </svg>
  </a>

  <button class="top-btn top-btn--right" id="theme-toggle" aria-label="Toggle light/dark theme">
    <svg id="theme-icon-dark" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg id="theme-icon-light" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  </button>

  <div class="aria-center">
    <p class="aria-center__wordmark">ARIA</p>
    <p class="aria-center__sub">All-knowing · Always present</p>
  </div>

  <p class="aria-hint">tap the orb to begin</p>

  <script>
    const root = document.documentElement;
    const btn = document.getElementById('theme-toggle');
    const iconDark  = document.getElementById('theme-icon-dark');
    const iconLight = document.getElementById('theme-icon-light');

    applyTheme(localStorage.getItem('aria-theme') || 'dark');

    btn.addEventListener('click', () => {
      const next = root.dataset.theme === 'light' ? 'dark' : 'light';
      localStorage.setItem('aria-theme', next);
      applyTheme(next);
    });

    function applyTheme(t) {
      root.dataset.theme = t;
      iconDark.style.display  = t === 'light' ? 'block' : 'none';
      iconLight.style.display = t === 'light' ? 'none'  : 'block';
    }
  </script>

  <script src="/rag7/companion.js"></script>
</body>
</html>
