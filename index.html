<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional business card for Stacey Williams, Certified Service Technician at Mercedes Benz Of Collierville">
    <meta name="theme-color" content="#C0C0C0">
    <title>Stacey Williams - Digital Business Card</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="icon-192.svg">
    <link rel="apple-touch-icon" href="icon-512.svg">
</head>
<body>
    <div class="card-container">
        <div class="business-card">
            <!-- Header with Mercedes Logo -->
            <div class="header">
                <div class="logo">
                    <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="30" cy="30" r="28" stroke="#C0C0C0" stroke-width="2"/>
                        <path d="M30 10 L30 30 L50 45" stroke="#C0C0C0" stroke-width="2"/>
                        <path d="M30 30 L10 45" stroke="#C0C0C0" stroke-width="2"/>
                        <circle cx="30" cy="30" r="3" fill="#C0C0C0"/>
                    </svg>
                </div>
            </div>

            <!-- Content Section -->
            <div class="content">
                <h1 class="name">Stacey Williams</h1>
                <p class="title">Certified Service Technician</p>
                <p class="company">Mercedes Benz Of Collierville</p>

                <!-- Contact Information -->
                <div class="contact-info">
                    <div class="contact-item" data-copy="tel:+19015555555">
                        <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" fill="#C0C0C0"/>
                        </svg>
                        <a href="tel:+19015555555" id="phone-link">(901) 555-5555</a>
                        <button class="copy-btn" data-copy="(901) 555-5555" aria-label="Copy phone number">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="9" y="9" width="13" height="13" rx="2" stroke="#C0C0C0" stroke-width="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="#C0C0C0" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>

                    <div class="contact-item" data-copy="mailto:stacey.williams@mbofcollierville.com">
                        <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="#C0C0C0" stroke-width="2"/>
                            <polyline points="22,6 12,13 2,6" stroke="#C0C0C0" stroke-width="2"/>
                        </svg>
                        <a href="mailto:stacey.williams@mbofcollierville.com" id="email-link">stacey.williams@mbofcollierville.com</a>
                        <button class="copy-btn" data-copy="stacey.williams@mbofcollierville.com" aria-label="Copy email">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="9" y="9" width="13" height="13" rx="2" stroke="#C0C0C0" stroke-width="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="#C0C0C0" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>

                    <div class="contact-item" data-copy="https://www.mbofcollierville.com">
                        <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10" stroke="#C0C0C0" stroke-width="2"/>
                            <line x1="2" y1="12" x2="22" y2="12" stroke="#C0C0C0" stroke-width="2"/>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" stroke="#C0C0C0" stroke-width="2"/>
                        </svg>
                        <a href="https://www.mbofcollierville.com" target="_blank" rel="noopener noreferrer">mbofcollierville.com</a>
                        <button class="copy-btn" data-copy="https://www.mbofcollierville.com" aria-label="Copy website URL">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="9" y="9" width="13" height="13" rx="2" stroke="#C0C0C0" stroke-width="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="#C0C0C0" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>

                    <div class="contact-item" data-copy="850 W Poplar Ave, Collierville, TN 38017">
                        <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" stroke="#C0C0C0" stroke-width="2"/>
                            <circle cx="12" cy="10" r="3" stroke="#C0C0C0" stroke-width="2"/>
                        </svg>
                        <a href="https://maps.google.com/?q=850+W+Poplar+Ave,+Collierville,+TN+38017" target="_blank" rel="noopener noreferrer">850 W Poplar Ave, Collierville, TN 38017</a>
                        <button class="copy-btn" data-copy="850 W Poplar Ave, Collierville, TN 38017" aria-label="Copy address">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="9" y="9" width="13" height="13" rx="2" stroke="#C0C0C0" stroke-width="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="#C0C0C0" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="action-btn" id="download-vcard" aria-label="Download vCard">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2"/>
                            <polyline points="7 10 12 15 17 10" stroke="currentColor" stroke-width="2"/>
                            <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span>Save Contact</span>
                    </button>

                    <button class="action-btn" id="share-card" aria-label="Share card">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="2"/>
                            <circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                            <circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="2"/>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" stroke="currentColor" stroke-width="2"/>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span>Share Card</span>
                    </button>

                    <button class="action-btn" id="theme-toggle" aria-label="Toggle theme">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span>Theme</span>
                    </button>
                </div>

                <!-- Install PWA Button -->
                <button class="install-btn" id="install-pwa" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: inline-block; vertical-align: middle; margin-right: 8px;">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2"/>
                        <polyline points="7 10 12 15 17 10" stroke="currentColor" stroke-width="2"/>
                        <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    Install App
                </button>
            </div>
        </div>
    </div>

    <!-- AI Chat Interface -->
    <button class="ai-chat-toggle" id="ai-chat-toggle" aria-label="Open AI Assistant">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" fill="currentColor"/>
        </svg>
        <span class="ai-badge" id="ai-badge">AI</span>
    </button>

    <div class="ai-chat-container" id="ai-chat-container">
        <div class="ai-chat-header">
            <div class="ai-header-info">
                <div class="ai-avatar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" fill="#C0C0C0"/>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="9" cy="9" r="1" fill="#1a1a1a"/>
                        <circle cx="15" cy="9" r="1" fill="#1a1a1a"/>
                    </svg>
                </div>
                <div class="ai-header-text">
                    <h3>AI Assistant</h3>
                    <p class="ai-status">Online • Ready to help</p>
                </div>
            </div>
            <button class="ai-close-btn" id="ai-close-btn" aria-label="Close AI Assistant">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2"/>
                    <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2"/>
                </svg>
            </button>
        </div>

        <div class="ai-chat-messages" id="ai-chat-messages">
            <div class="ai-message ai-message-bot">
                <div class="ai-message-content">
                    <p>👋 Hi! I'm Stacey's AI assistant. How can I help you today?</p>
                    <div class="ai-quick-actions">
                        <button class="quick-action-btn" data-action="services">Services Offered</button>
                        <button class="quick-action-btn" data-action="hours">Business Hours</button>
                        <button class="quick-action-btn" data-action="appointment">Schedule Service</button>
                        <button class="quick-action-btn" data-action="location">Location & Directions</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="ai-chat-input-container">
            <input 
                type="text" 
                class="ai-chat-input" 
                id="ai-chat-input" 
                placeholder="Ask me anything about our services..."
                aria-label="Chat with AI assistant"
            >
            <button class="ai-send-btn" id="ai-send-btn" aria-label="Send message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="22" y1="2" x2="11" y2="13" stroke="currentColor" stroke-width="2"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2" fill="currentColor"/>
                </svg>
            </button>
        </div>

        <div class="ai-typing-indicator" id="ai-typing-indicator" style="display: none;">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Scripts -->
    <script src="knowledge-base.js"></script>
    <script src="ai-agent.js"></script>
    <script src="chat-interface.js"></script>
    <script src="api-integration.js"></script>
    <script src="app.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed'));
            });
        }
    </script>
</body>
</html>
