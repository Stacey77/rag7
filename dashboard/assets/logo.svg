<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Lion head with purple theme -->
  <defs>
    <linearGradient id="lionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B68A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B4B8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="maneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8555;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Mane -->
  <circle cx="50" cy="50" r="45" fill="url(#maneGradient)" opacity="0.3"/>
  <path d="M 50 5 Q 65 15, 75 25 Q 85 35, 90 50 Q 85 65, 75 75 Q 65 85, 50 95 Q 35 85, 25 75 Q 15 65, 10 50 Q 15 35, 25 25 Q 35 15, 50 5 Z" 
        fill="url(#maneGradient)" opacity="0.5"/>
  
  <!-- Face -->
  <circle cx="50" cy="50" r="30" fill="url(#lionGradient)"/>
  
  <!-- Eyes -->
  <circle cx="42" cy="45" r="4" fill="#FFFFFF"/>
  <circle cx="58" cy="45" r="4" fill="#FFFFFF"/>
  <circle cx="43" cy="45" r="2" fill="#2E2547"/>
  <circle cx="59" cy="45" r="2" fill="#2E2547"/>
  
  <!-- Nose -->
  <path d="M 50 55 L 47 58 L 53 58 Z" fill="#2E2547"/>
  
  <!-- Mouth -->
  <path d="M 50 58 Q 45 62, 42 60 M 50 58 Q 55 62, 58 60" 
        stroke="#2E2547" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Whiskers -->
  <line x1="30" y1="50" x2="20" y2="48" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
  <line x1="30" y1="52" x2="20" y2="54" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
  <line x1="70" y1="50" x2="80" y2="48" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
  <line x1="70" y1="52" x2="80" y2="54" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
</svg>
