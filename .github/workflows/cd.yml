name: CD

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  # ── Shared build job ──────────────────────────────────────────────────────
  # Runs on every trigger (main push OR version tag) and produces a tagged
  # image that the downstream deploy jobs can reference.
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_URL }}/trading-engine
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push trading-engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.trading-engine
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Staging deployment (main branch only) ────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    needs: [build]
    if: github.ref_type == 'branch' && github.ref_name == 'main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Write kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
        env:
          KUBECONFIG_DATA: ${{ secrets.STAGING_KUBECONFIG }}

      - name: Apply namespace and staging config
        run: |
          kubectl apply -f infrastructure/kubernetes/namespace.yaml
          kubectl apply -f infrastructure/kubernetes/configmap-staging.yaml

      - name: Deploy to staging Kubernetes
        run: |
          kubectl apply -f infrastructure/kubernetes/deployments/
          kubectl set image deployment/trading-engine \
            trading-engine=${{ secrets.REGISTRY_URL }}/trading-engine:${{ needs.build.outputs.image_tag }} \
            --namespace trading
          kubectl rollout status deployment/trading-engine --namespace trading --timeout=180s

  # ── Production deployment (version tags only) ─────────────────────────────
  # Intentionally independent of deploy-staging so that pushing a release tag
  # always triggers a production deploy regardless of the last main-branch run.
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    needs: [build]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Write kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
        env:
          KUBECONFIG_DATA: ${{ secrets.PRODUCTION_KUBECONFIG }}

      - name: Apply namespace and production config
        run: |
          kubectl apply -f infrastructure/kubernetes/namespace.yaml
          kubectl apply -f infrastructure/kubernetes/configmap-production.yaml

      - name: Deploy to production Kubernetes
        run: |
          kubectl apply -f infrastructure/kubernetes/deployments/
          kubectl set image deployment/trading-engine \
            trading-engine=${{ secrets.REGISTRY_URL }}/trading-engine:${{ needs.build.outputs.image_tag }} \
            --namespace trading
          kubectl rollout status deployment/trading-engine --namespace trading --timeout=180s
