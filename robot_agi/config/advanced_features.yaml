meta_learning:
  enable: true
  algorithm: "maml"
  adaptation_steps: 5
  meta_batch_size: 4

multimodal:
  modalities: ["vision", "audio", "tactile", "proprioception"]
  fusion_method: "transformer"
  attention_heads: 8

hierarchical_planning:
  levels: 3
  planning_horizon: [1000, 100, 10]
  replan_frequency: [10, 1, 0.1]

social_intelligence:
  emotion_recognition: true
  theory_of_mind: true
  social_navigation: true
  personal_space: 1.2

swarm:
  enable: false
  num_robots: 10
  coordination: "decentralized"
  communication_range: 10.0

explainability:
  enable: true
  explanation_level: "detailed"
  visualize_attention: true
  natural_language: true

memory:
  episodic_capacity: 10000
  semantic_capacity: 100000
  working_memory_size: 7
  consolidation_rate: 0.1

optimization:
  quantization: "int8"
  pruning_sparsity: 0.5
  use_tensorrt: true
  target_latency: 50
